name: 同步上游并构建

# 用法：仓库 → Actions → “同步上游并构建” → Run workflow。
# 自动把上游 cyberdaddyleo/yutang 的 main 合并到你的 fork，
# 合并成功并 push 后会自动触发“构建 Windows 安装包”。
# 若合并冲突，本任务失败，需在本地解决冲突后再继续。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出你的仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 合并上游 main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/cyberdaddyleo/yutang.git
          git fetch upstream --depth=1
          if git merge --no-edit --ff upstream/main; then
            echo ">> 上游已是最新，无需合并"
          else
            echo ">> 正在合并上游更新..."
            git merge --abort || true
            git merge --no-edit upstream/main
          fi
          git push origin main
