name: Build Windows EXE

# 在原生 Windows 环境打包，产出标准 NSIS 安装包（本机 Linux 无 wine 时用此方式）。
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile

      - name: 构建前端
        run: pnpm build

      - name: 打包 Windows NSIS 安装包
        run: npx electron-builder --win nsis --x64

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: 浮生摸鱼桌面-Win安装包
          path: release/*.exe
          if-no-files-found: error
